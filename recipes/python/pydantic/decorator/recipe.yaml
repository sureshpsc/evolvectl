apiVersion: evolvectl.dev/v1alpha1
kind: MigrationRecipe
metadata:
  id: python.decorator.validator
  title: Rename validator to field_validator
  owners:
    - evolvectl-maintainers
  tags:
    - python
    - pydantic
spec:
  language: python
  dependency:
    ecosystem: python
    name: pydantic
    from: ">=1.0.0 <2.0.0"
    to: ">=2.0.0"
  match:
    type: decorator
    symbol: validator
  transform:
    type: python_decorator_rename
    target_symbol: field_validator
  safety:
    confidence: high
    generated_files: deny
    require_type_info: false
  validate:
    - python syntax
