apiVersion: evolvectl.dev/v1alpha1
kind: MigrationRecipe
metadata:
  id: go.grpc.dialcontext-to-newclient
  title: Replace grpc.DialContext with grpc.NewClient
  owners:
    - evolvectl-maintainers
  tags:
    - go
    - grpc
spec:
  language: go
  dependency:
    ecosystem: gomod
    name: google.golang.org/grpc
    from: ">=1.0.0 <1.75.0"
    to: ">=1.75.0"
  match:
    type: call
    package: google.golang.org/grpc
    symbol: DialContext
  transform:
    type: call_rewrite
    target_symbol: NewClient
    arguments:
      remove:
        - index: 0
  safety:
    confidence: high
    generated_files: deny
    require_type_info: true
  validate:
    - gofmt
