apiVersion: evolvectl.dev/v1alpha1
kind: MigrationRecipe
metadata:
  id: go.gax.apicall-callsettings
  title: Add the CallSettings parameter to gax.APICall conversions
  owners:
    - evolvectl-maintainers
  tags:
    - go
    - gax
spec:
  language: go
  dependency:
    ecosystem: gomod
    name: github.com/googleapis/gax-go
    from: "<2.0.0"
    to: ">=2.0.0"
  match:
    type: call
    package: github.com/googleapis/gax-go/v2
    symbol: APICall
  transform:
    type: callback_param_append
    callback:
      index: 0
      name: _
      type: "{pkg}.CallSettings"
      when_params: 1
  safety:
    confidence: high
    generated_files: deny
    require_type_info: false
  validate:
    - gofmt
