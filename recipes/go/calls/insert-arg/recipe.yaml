apiVersion: evolvectl.dev/v1alpha1
kind: MigrationRecipe
metadata:
  id: go.call.insert-arg
  title: Insert a call argument
  owners:
    - evolvectl-maintainers
  tags:
    - go
spec:
  language: go
  dependency:
    ecosystem: gomod
    name: example.com/lib
    from: ">=1.0.0 <1.75.0"
    to: ">=1.75.0"
  match:
    type: call
    package: example.com/lib
    symbol: Connect
  transform:
    type: call_argument_insert
    arguments:
      insert:
        - index: 0
          expr: ctx
  safety:
    confidence: high
    generated_files: deny
    require_type_info: true
  validate:
    - gofmt
